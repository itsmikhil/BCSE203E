<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 class="ans"></h1>
    <script>
        let box=document.querySelector(".ans");
        let ans=0;
        for(let i=1;i<=200;i=i+2){
            ans+=i;
        }
        box.innerHTML=`Sum of odd numbers from 1 to 200 is ${ans}`
    </script>
</body>
</html>
