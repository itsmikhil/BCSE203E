<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      const config = { totalButtons: 3 };

      const main = document.createElement("div");
      document.body.appendChild(main);

      const createElement = (type, parent, content) => {
        const el = document.createElement(type);
        if (content) el.textContent = content;
        parent.appendChild(el);
        return el;
      };

      const list = createElement("ul", main);

      for (let i = 1; i <= config.totalButtons; i++) {
        const btn = createElement("button", main, `Page ${i}: 0`);
        btn.className = "btn";
        btn.total = 0;
        btn.style.margin = "5px";
        btn.style.padding = "10px";
        btn.style.fontSize = "16px";

        btn.onclick = function () {
          this.total++;
          this.textContent = `Page ${i}: ${this.total}`;
        };
      }

      const tallyBtn = createElement("button", main, "Show Totals");
      tallyBtn.style.display = "block";
      tallyBtn.style.marginTop = "15px";
      tallyBtn.style.padding = "10px";

      tallyBtn.onclick = function () {
        list.innerHTML = "";
        document.querySelectorAll(".btn").forEach((btn) => {
          const li = document.createElement("li");
          li.textContent = `${btn.textContent} | Total: ${btn.total}`;
          li.style.fontSize = btn.style.fontSize;
          li.style.margin = "5px";
          list.appendChild(li);
        });
      };
    </script>
  </body>
</html>
