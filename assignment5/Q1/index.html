<!doctype html>
<html>
  <head>
    <title>Show Date and Time</title>
  </head>

  <body>
    <h2>Display Date and Time</h2>

    <button onclick="displayDate()">The time is?</button>

    <p id="demo"></p>

    <script>
      function displayDate() {
        let currentDate = new Date();
        document.getElementById("demo").innerHTML = currentDate;
      }
    </script>
  </body>
</html>
