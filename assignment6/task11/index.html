<!DOCTYPE html>
<html>
<head>
    <title>Digital Clock</title>
</head>
<body>

<h2 id="clock"></h2>

<script>

function showTime() {

    let now = new Date();

    let h = now.getHours();
    let m = now.getMinutes();
    let s = now.getSeconds();

    // Add 0 if less than 10
    if (h < 10) h = "0" + h;
    if (m < 10) m = "0" + m;
    if (s < 10) s = "0" + s;

    let time = h + ":" + m + ":" + s;

    document.getElementById("clock").innerHTML = time;
}
setInterval(showTime, 1000);

</script>

</body>
</html>
