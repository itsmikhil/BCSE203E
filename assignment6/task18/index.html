<!doctype html>
<html>
  <head>
    <title>Join Array Elements</title>
  </head>
  <body>
    <script>
      let names = [];

      for (let i = 0; i < 10; i++) {
        let name = prompt("Enter name " + (i + 1) + ":");
        names.push(name);
      }
      let result = names.join(", ");

      document.write("Joined Names: <br>");
      document.write(result);
    </script>
  </body>
</html>
