<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let body = document.querySelector("body");
      let generateRandom = () => {
        return Math.floor(Math.random() * 255);
      };
      setInterval(
        (()=>{body.style.backgroundColor = `rgb(${generateRandom()},${generateRandom()},${generateRandom()})`}),
        2000,
      );
    </script>
  </body>
</html>
